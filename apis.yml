description: 'Arsanis was a clinical-stage biopharmaceutical company in the life-sciences sector,
  focused on developing monoclonal antibody immunotherapies to prevent and treat serious infectious
  diseases. It was surfaced as a portfolio company of GV (Google Ventures) and added to the API
  Evangelist network as a company stub. Arsanis operated as a therapeutics developer rather than a
  software or API provider, and the company no longer exists as an independent entity; its public web
  presence at arsanis.com is no longer served. This profile is retained as a portfolio-graph lead with
  no active developer, API, or documentation surface to enrich.'
